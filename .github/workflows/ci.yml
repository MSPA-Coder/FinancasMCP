name: CI

on:
  push:
    branches: [main]
  # Sem filtro de `branches`, de proposito: a verificacao roda em PR para
  # QUALQUER base. Com o filtro, um PR empilhado nao disparava check nenhum, e o
  # sintoma era a ausencia de sinal (pagina limpa que parece aprovada).
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # `requires-python = ">=3.14"` no pyproject: a CI roda a versao que o
          # projeto exige, nao uma mais antiga.
          python-version: "3.14"
      # Mesma versao do uv que os Dockerfiles dos irmaos fixam. Vem pelo pip, e
      # nao por action: a politica do repositorio barra action de terceiro.
      - name: Instalar o uv
        run: python -m pip install "uv==0.12.10"
      # `--locked` recusa um uv.lock que nao bate com o pyproject.toml, em vez de
      # resolver de novo em silencio: a CI testa exatamente as versoes que a
      # maquina do mantenedor instala. O interpretador e o do setup-python; sem
      # `UV_PYTHON_DOWNLOADS=never` o uv poderia baixar outro.
      - name: Instalar o projeto pelo lock
        env:
          UV_PYTHON_DOWNLOADS: never
        run: python -m uv sync --locked --extra dev --python "$(command -v python)"
      - name: Ruff
        run: .venv/bin/python -m ruff check .
      # Aqui roda o que nao depende de banco, em segundos. Os testes marcados
      # `banco_local` rodam no job "Testes com banco", logo abaixo.
      - name: Testes (sem banco)
        run: .venv/bin/python -m pytest -q -m "not banco_local"
      # O Dependabot avisa de versao nova; esta etapa responde outra pergunta:
      # a versao instalada AGORA tem CVE conhecido? O projeto em si nao esta no
      # PyPI, por isso `--skip-editable`. Vulnerabilidade sem correcao publicada
      # sai por `--ignore-vuln <ID>` com comentario dizendo por que.
      - name: Auditar dependencias instaladas (CVE conhecido)
        run: .venv/bin/pip-audit --progress-spinner=off --skip-editable

  # As consultas daqui leem as tabelas do CB e do CRV, que mudam sem este
  # repositorio saber: em 24/09/2026 a `crv_carteira` quebrou em producao porque
  # uma revisao do CRV removeu uma coluna. Este job sobe os dois a partir do
  # `main` de cada um, pelos proprios Compose, com o esquema que as migracoes
  # deles produzem, cria dados minimos (`tests/ci/`) e roda a suite inteira. Os
  # dois sao publicos: nenhum token entra aqui. Com o cron de segunda-feira, uma
  # quebra de esquema la reprova aqui em ate uma semana, antes de alguem notar
  # pelo Claude.
  banco:
    name: Testes com banco
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Baixar o CB (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MSPA-Coder/sistema-financeiro
          path: _sistemas/cb
          persist-credentials: false
      - name: Baixar o CRV (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MSPA-Coder/ControleRendaVariavel
          path: _sistemas/crv
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Instalar o uv
        run: python -m pip install "uv==0.12.10"
      - name: Instalar o projeto pelo lock
        env:
          UV_PYTHON_DOWNLOADS: never
        run: python -m uv sync --locked --extra dev --python "$(command -v python)"
      # Segredos efemeros, build, PostgreSQL, migracoes e semente de cada um. Os
      # conteineres e as portas (5202 e 5302) sao os do Compose deles, os mesmos
      # da maquina do mantenedor.
      - name: Subir, migrar e semear o CB e o CRV
        run: .venv/bin/python tests/ci/preparar_bancos.py _sistemas/cb _sistemas/crv
      # O mesmo comando que o mantenedor roda na maquina dele: cria o
      # `mcp_leitura` com SELECT so em `dominio.TABELAS` e grava o config.toml.
      - name: Criar o usuario de leitura
        run: .venv/bin/python -m financas_mcp.usuario_leitura local
      - name: Testes (todos, com banco)
        run: .venv/bin/python -m pytest -q
