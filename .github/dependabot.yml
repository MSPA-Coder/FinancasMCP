version: 2
updates:
  # `uv`, e nao `pip`: o PR de atualizacao precisa trazer o uv.lock junto, ou a
  # CI recusa (`uv sync --locked`).
  - package-ecosystem: uv
    directory: "/"
    # Mantem o piso; so eleva o requisito quando indispensavel (o GitHub
    # nao aceita `widen`).
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
