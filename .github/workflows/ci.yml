name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Docker Python 3.15 e PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Baixar o CB (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MSPA-Coder/controle-bancario
          path: _sistemas/cb
          persist-credentials: false
      - name: Baixar o CRV (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MSPA-Coder/ControleRendaVariavel
          path: _sistemas/crv
          persist-credentials: false

      # Este script só prepara os bancos: Compose constrói, migra e semeia cada
      # checkout; nenhuma dependência ou teste do FinancasMCP roda no runner.
      # Python stdlib do runner é suficiente para a orquestração.
      - name: Preparar bancos descartáveis do CB e CRV
        run: python3 tests/ci/preparar_bancos.py _sistemas/cb _sistemas/crv
        env:
          # Os bancos descartáveis estão publicados pelo host do runner. O
          # contêiner quality os acessa pelo host-gateway; a execução normal
          # mantém a publicação local em 127.0.0.1.
          POSTGRES_BIND_ADDRESS: 0.0.0.0
      # Este comando administrativo cria uma credencial de leitura efêmera por
      # meio do Docker CLI e grava o config montado somente para leitura abaixo.
      - name: Criar o usuário de leitura para a suíte
        run: python3 -m financas_mcp.usuario_leitura local

      - name: Validar Compose
        run: docker compose --profile quality config --quiet
      - name: Construir o contêiner de qualidade com Python 3.15
        run: docker compose --profile quality build --pull --no-cache quality
      - name: Executar lint e suíte completa no contêiner
        run: docker compose --profile quality run --rm quality
      - name: Auditar dependências instaladas
        run: docker compose --profile quality run --rm --no-deps quality pip-audit --progress-spinner=off --skip-editable

      - name: Varredura HIGH/CRITICAL da imagem de qualidade
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          chmod 777 "$RUNNER_TEMP/trivy-cache"
          docker save financas-mcp-quality:local -o "$RUNNER_TEMP/quality.tar"
          chmod 644 "$RUNNER_TEMP/quality.tar"
          # A imagem a analisar já está no tar. Liberar as camadas de build
          # antes de baixar a base do Trivy evita esgotar o disco efêmero do
          # runner sem pular a varredura.
          docker image rm financas-mcp-quality:local
          docker builder prune --all --force
          docker compose -f .github/docker-compose.yml run --rm trivy \
            --cache-dir /tmp/trivy-cache \
            image --input /varredura/quality.tar \
                  --scanners vuln \
                  --severity HIGH,CRITICAL \
                  --ignore-unfixed \
                  --exit-code 1 \
                  --format table

      - name: Encerrar os bancos efêmeros sem remover volumes
        if: always()
        run: |
          docker compose --profile quality down --remove-orphans || true
          docker compose -f _sistemas/cb/compose.yaml down --remove-orphans || true
          docker compose -f _sistemas/crv/compose.yaml down --remove-orphans || true
