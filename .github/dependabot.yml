version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    # Alarga o teto declarado; o piso so muda quando indispensavel.
    versioning-strategy: widen
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
