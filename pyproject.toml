[project]
name = "financas-mcp"
version = "0.1.0"
description = "Servidor MCP somente leitura sobre ControleBancario e ControleRendaVariavel."
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.2,<3",
    "asyncssh>=2.21,<3",
    "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.16"]

[project.scripts]
financas-mcp = "financas_mcp.server:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["financas_mcp"]

[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Testes de integração contra os bancos LOCAIS de teste (precisam de ~/.financas-mcp/config.toml).
    # A CI não os roda: `-m "not banco_local"`. Localmente rodam todos, sem filtro.
    "banco_local: precisa do ambiente local com os bancos de teste do CB e do CRV",
]

[tool.ruff.lint.per-file-ignores]
# SQL em strings: quebrar as linhas das consultas as deixaria piores de ler.
"financas_mcp/server.py" = ["E501"]
