name: CI

on:
  push:
    branches: [main]
  # Sem filtro de `branches`, de proposito: a verificacao roda em PR para
  # QUALQUER base. Com o filtro, um PR empilhado nao disparava check nenhum, e o
  # sintoma era a ausencia de sinal (pagina limpa que parece aprovada).
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # `requires-python = ">=3.14"` no pyproject: a CI roda a versao que o
          # projeto exige, nao uma mais antiga.
          python-version: "3.14"
      - name: Instalar o projeto e as ferramentas de desenvolvimento
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      # Os testes marcados `banco_local` (18 casos) exercitam os bancos de teste do
      # CB e do CRV e precisam do `~/.financas-mcp/config.toml` da maquina do
      # mantenedor. Montar os dois esquemas na CI exigiria os repositorios
      # privados de cada sistema; por isso rodam localmente, antes de cada PR
      # que mexe em `server.py` ou `dominio.py`. Aqui roda o que nao depende de banco.
      - name: Testes (sem banco)
        run: python -m pytest -q -m "not banco_local"
      # O Dependabot avisa de versao nova; esta etapa responde outra pergunta:
      # a versao instalada AGORA tem CVE conhecido? O projeto em si nao esta no
      # PyPI, por isso `--skip-editable`. Vulnerabilidade sem correcao publicada
      # sai por `--ignore-vuln <ID>` com comentario dizendo por que.
      - name: Auditar dependencias instaladas (CVE conhecido)
        run: |
          python -m pip install "pip-audit>=2.10,<3"
          pip-audit --progress-spinner=off --skip-editable
