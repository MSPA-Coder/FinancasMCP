name: financas-mcp

services:
  quality:
    image: financas-mcp-quality:local
    build:
      context: .
      dockerfile: Dockerfile.test
      pull: true
    profiles: [quality]
    pull_policy: never
    command: ["sh", "-ec", "ruff check . && pytest -q"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: "2.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FINANCAS_MCP_CONFIG: /run/financas-mcp/config.toml
      FINANCAS_MCP_LOCAL_HOST: host.docker.internal
      HOME: /tmp
      PIP_CACHE_DIR: /tmp/pip-cache
      PYTEST_ADDOPTS: -p no:cacheprovider
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      RUFF_CACHE_DIR: /tmp/ruff-cache
    volumes:
      - type: bind
        source: ${FINANCAS_MCP_CONFIG_HOST_PATH:-${USERPROFILE:-${HOME}}/.financas-mcp/config.toml}
        target: /run/financas-mcp/config.toml
        read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=128m
